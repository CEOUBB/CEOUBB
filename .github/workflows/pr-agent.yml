name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: Run PR Agent
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' ||
       github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    steps:
      - name: PR Agent Action
        uses: qodo-ai/pr-agent@ab6ec54bfeb37933ddb74259338752e9272016c6 # v0.44.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL: "gemini/gemini-3.7-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-3.6-flash", "gemini/gemini-3.5-flash", "gemini/gemini-3.1-flash", "gemini/gemini-3-flash"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: 64000
          CONFIG.MAX_MODEL_TOKENS: 64000
          CONFIG.RESPONSE_LANGUAGE: "es-ES"
          LITELLM.REASONING_EFFORT: "high"
