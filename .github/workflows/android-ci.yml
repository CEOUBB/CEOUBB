# Implements: REQ-CICD-01, REQ-CICD-02
name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-android:
    name: Build & Lint Android APK (Capacitor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Assemble Debug APK & Lint
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug lintDebug --no-daemon --stacktrace
