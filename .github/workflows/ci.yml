name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firebase_rules:
    name: Firebase Rules Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('pnpm-lock.yaml', 'firebase/firebase.json') }}

      - name: Run Firestore and Storage rules matrix
        run: pnpm run check:rules

  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Run Fast Verification (Typecheck, Hashes, Specs)
        run: pnpm run verify:fast

      - name: Run Security Invariants & Rules Check
        run: pnpm run verify:invariants

      - name: Check Cloud Functions Syntax
        run: pnpm run check:functions

      - name: Verify Code Formatting
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Production Build
        run: pnpm run build

      - name: Run Rendered HTML & HTTP Smoke Tests
        run: node tests/rendered-html.test.mjs
        env:
          CEOUBB_ENVIRONMENT: preview

      - name: Run Bundle Size Check
        run: node scripts/check-bundle-size.mjs

      - name: Notify Discord on Failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_CEOUBB_BOT_TOKEN || secrets.DISCORD_BOT_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const channelId = "1536936245643579462"; // #🚨-❙-alertas
            const botToken = process.env.DISCORD_BOT_TOKEN;
            const rawSha = process.env.COMMIT_SHA || "";
            const sha = rawSha ? rawSha.slice(0, 7) : "commit";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const actor = process.env.ACTOR || "desconocido";
            const ref = process.env.REF_NAME || "main";
            const workflow = process.env.WORKFLOW_NAME || "CI/CD";

            const embed = {
              title: `🔴 Fallo en Pipeline: ${workflow}`,
              description: `Se detectó un fallo durante la verificación de calidad en \`${ref}\`.\n\n` +
                `• **Commit:** [\`${sha}\`](${runUrl})\n` +
                `• **Autor:** @${actor}\n` +
                `• **Diagnóstico:** Revisa el linter, typecheck o tests en los logs.\n\n` +
                `🔗 **[Ver detalles del fallo en GitHub Actions](${runUrl})**`,
              color: 0xef4444,
              timestamp: new Date().toISOString(),
              footer: { text: "CEOUBB CI/CD Inspector" }
            };

            if (botToken) {
              try {
                await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bot ${botToken}`,
                  },
                  body: JSON.stringify({ embeds: [embed] })
                });
              } catch (e) {
                console.error("Error enviando alerta a Discord:", e);
              }
            }

  firebase_rules:
    name: Firebase Rules Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Firebase rules and invariants
        run: pnpm run verify:invariants
