name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firebase_rules:
    name: Firebase Rules Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('pnpm-lock.yaml', 'firebase/firebase.json') }}

      - name: Run Firestore and Storage rules matrix
        run: pnpm run check:rules

  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Run Fast Verification (Typecheck, Hashes, Specs)
        run: pnpm run verify:fast

      - name: Run Security Invariants & Rules Check
        run: pnpm run verify:invariants

      - name: Check Cloud Functions Syntax
        run: pnpm run check:functions

      - name: Verify Code Formatting
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Production Build
        run: pnpm run build

      - name: Run Rendered HTML & HTTP Smoke Tests
        run: node tests/rendered-html.test.mjs
        env:
          CEOUBB_ENVIRONMENT: preview

      - name: Run Bundle Size Check
        run: node scripts/check-bundle-size.mjs
