name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy-prod.outputs.url || steps.deploy-preview.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Git Author for Vercel Hobby Plan
        run: |
          git config user.name "CEOUBB"
          git config user.email "elpapijuaco325@gmail.com"
          git commit --amend --author="CEOUBB <elpapijuaco325@gmail.com>" --no-edit

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Firebase Functions syntax
        run: pnpm run check:functions

      - name: Check Firebase Security Rules
        run: pnpm run check:rules

      - name: Fast unit test suite
        run: pnpm run test:unit

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Lint code
        run: pnpm run lint

      - name: Pull Vercel Environment Information (Production)
        if: github.event_name == 'push'
        run: pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Pull Vercel Environment Information (Preview)
        if: github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != ''
        run: pnpm exec vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Build Project Artifacts (Production)
        if: github.event_name == 'push'
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != ''
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Deploy Production Artifacts to Vercel
        id: deploy-prod
        if: github.event_name == 'push'
        run: |
          PROD_URL=$(pnpm exec vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }} | grep -E '^https?://' | tail -n 1)
          echo "url=${PROD_URL}" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Deploy Preview Artifacts to Vercel
        id: deploy-preview
        if: github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != ''
        run: |
          PREVIEW_URL=$(pnpm exec vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} | grep -E '^https?://' | tail -n 1)
          echo "url=${PREVIEW_URL}" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != '' && steps.deploy-preview.outputs.url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = process.env.PREVIEW_URL || '';
            const commentHeader = '### 🚀 Vercel Preview Deployment';
            const body = `${commentHeader}\n\n| Attribute | Details |\n| --- | --- |\n| 🔨 **Commit** | \`${context.sha.slice(0, 7)}\` |\n| 🌐 **Preview Link** | [${previewUrl}](${previewUrl}) |\n\n*Deployed via GitHub Actions*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(commentHeader));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Notify Discord on Failure
        if: failure()
        uses: actions/github-script@v9
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_CEOUBB_BOT_TOKEN || secrets.DISCORD_BOT_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const channelId = "1536936245643579462"; // #🚨-❙-alertas
            const botToken = process.env.DISCORD_BOT_TOKEN;
            const rawSha = process.env.COMMIT_SHA || "";
            const sha = rawSha ? rawSha.slice(0, 7) : "commit";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const actor = process.env.ACTOR || "desconocido";
            const ref = process.env.REF_NAME || "main";
            const workflow = process.env.WORKFLOW_NAME || "CI/CD";

            const embed = {
              title: `🔴 Fallo en Pipeline: ${workflow}`,
              description: `Se detectó un fallo durante la verificación de calidad en \`${ref}\`.\n\n` +
                `• **Commit:** [\`${sha}\`](${runUrl})\n` +
                `• **Autor:** @${actor}\n` +
                `• **Diagnóstico:** Revisa el linter, typecheck o tests en los logs.\n\n` +
                `🔗 **[Ver detalles del fallo en GitHub Actions](${runUrl})**`,
              color: 0xef4444,
              timestamp: new Date().toISOString(),
              footer: { text: "CEOUBB CI/CD Inspector" }
            };

            if (botToken) {
              try {
                await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bot ${botToken}`,
                  },
                  body: JSON.stringify({ embeds: [embed] })
                });
              } catch (e) {
                console.error("Error enviando alerta a Discord:", e);
              }
            }
