name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  staging:
    name: Validate main in staging
    if: github.event_name == 'push'
    uses: ./.github/workflows/firebase-release.yml
    with:
      promote_to_production: false
    secrets: inherit

  deploy:
    needs: staging
    if: always() && (github.event_name == 'pull_request' || needs.staging.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Firebase Functions syntax
        run: pnpm run check:functions

      - name: Check Firebase Security Rules
        run: pnpm run check:rules

      - name: Fast unit test suite
        run: pnpm run test:unit

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Lint code
        run: pnpm run lint

      - name: Build Project Artifacts (Cloudflare OpenNext)
        env:
          NEXT_PUBLIC_CEOUBB_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          CEOUBB_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        run: pnpm run cloudflare:build

      - name: Deploy Production Artifacts to Cloudflare Workers
        id: deploy-prod
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN no está configurado."
            exit 1
          fi
          pnpm exec wrangler deploy
          echo "url=https://ceoubb.com" >> $GITHUB_OUTPUT

      - name: Deploy Preview Artifacts to Cloudflare Workers
        id: deploy-preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            pnpm exec wrangler deploy --env preview
          fi
          echo "deployment_url=https://ceoubb-preview.nameless-sky-3eb5.workers.dev" >> $GITHUB_OUTPUT
          echo "preview_url=https://ceoubb-preview.nameless-sky-3eb5.workers.dev" >> $GITHUB_OUTPUT
          echo "url=https://staging.ceoubb.com" >> $GITHUB_OUTPUT

      - name: Register GitHub Deployment Status
        if: success() && (steps.deploy-prod.outputs.url != '' || steps.deploy-preview.outputs.url != '')
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy-prod.outputs.url || steps.deploy-preview.outputs.preview_url || steps.deploy-preview.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            if (!deployUrl) return;

            const isProd = context.eventName === 'push';
            const environment = isProd ? 'Production' : 'Preview';

            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: environment,
                description: `Despliegue de ${environment} en Cloudflare Workers`,
                auto_merge: false,
                required_contexts: [],
                transient_environment: !isProd,
                production_environment: isProd,
              });

              if (deployment.data && deployment.data.id) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.data.id,
                  state: 'success',
                  environment_url: deployUrl,
                  log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  description: `Desplegado exitosamente en ${environment} (${deployUrl})`,
                  auto_inactive: isProd,
                });
                console.log(`GitHub Deployment registrado exitosamente para ${environment}: ${deployUrl}`);
              }
            } catch (err) {
              console.error('Error registrando GitHub Deployment:', err.message);
            }

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request' && (steps.deploy-preview.outputs.preview_url != '' || steps.deploy-preview.outputs.url != '')
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.preview_url || steps.deploy-preview.outputs.deployment_url }}
          STAGING_URL: ${{ steps.deploy-preview.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = process.env.PREVIEW_URL || '';
            const stagingUrl = process.env.STAGING_URL || '';
            const commentHeader = '### 🚀 Cloudflare Preview Deployment';
            const body = `${commentHeader}\n\n| Atributo | Detalle |\n| --- | --- |\n| 🔨 **Commit** | \`${context.sha.slice(0, 7)}\` |\n| 🌐 **Worker Preview URL** | [${previewUrl}](${previewUrl}) |\n| 🧪 **Staging** | [${stagingUrl}](${stagingUrl}) |\n\n*Desplegado automáticamente en Cloudflare Workers*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(commentHeader));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Notify Discord on Failure
        if: failure()
        uses: actions/github-script@v7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_CEOUBB_BOT_TOKEN || secrets.DISCORD_BOT_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const channelId = "1536936245643579462"; // #🚨-❙-alertas
            const botToken = process.env.DISCORD_BOT_TOKEN;
            const rawSha = process.env.COMMIT_SHA || "";
            const sha = rawSha ? rawSha.slice(0, 7) : "commit";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const actor = process.env.ACTOR || "desconocido";
            const ref = process.env.REF_NAME || "main";
            const workflow = process.env.WORKFLOW_NAME || "CI/CD";

            const embed = {
              title: `🔴 Fallo en Pipeline: ${workflow}`,
              description: `Se detectó un fallo durante la verificación de calidad en \`${ref}\`.\n\n` +
                `• **Commit:** [\`${sha}\`](${runUrl})\n` +
                `• **Autor:** @${actor}\n` +
                `• **Diagnóstico:** Revisa el linter, typecheck o tests en los logs.\n\n` +
                `🔗 **[Ver detalles del fallo en GitHub Actions](${runUrl})**`,
              color: 0xef4444,
              timestamp: new Date().toISOString(),
              footer: { text: "CEOUBB CI/CD Inspector" }
            };

            if (botToken) {
              try {
                await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bot ${botToken}`,
                  },
                  body: JSON.stringify({ embeds: [embed] })
                });
              } catch (e) {
                console.error("Error enviando alerta a Discord:", e);
              }
            }
