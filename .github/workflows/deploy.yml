name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy-prod.outputs.url || steps.deploy-preview.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Author for Vercel Hobby Plan
        run: |
          git config user.name "CEOUBB"
          git config user.email "elpapijuaco325@gmail.com"
          git commit --amend --author="CEOUBB <elpapijuaco325@gmail.com>" --no-edit

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Firebase Functions syntax
        run: pnpm run check:functions

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Lint code
        run: pnpm run lint

      - name: Run test suite
        run: pnpm test

      - name: Pull Vercel Environment Information (Production)
        if: github.event_name == 'push'
        run: pnpm vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Pull Vercel Environment Information (Preview)
        if: github.event_name == 'pull_request'
        run: pnpm vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Build Project Artifacts (Production)
        if: github.event_name == 'push'
        run: pnpm vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request'
        run: pnpm vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Deploy Production Artifacts to Vercel
        id: deploy-prod
        if: github.event_name == 'push'
        run: |
          PROD_URL=$(pnpm vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$PROD_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Deploy Preview Artifacts to Vercel
        id: deploy-preview
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW_URL=$(pnpm vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_NAME: "CEOUBB"
          VERCEL_GIT_COMMIT_AUTHOR_EMAIL: "elpapijuaco325@gmail.com"

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.deploy-preview.outputs.url }}';
            const commentHeader = '### 🚀 Vercel Preview Deployment';
            const body = `${commentHeader}\n\n| Attribute | Details |\n| --- | --- |\n| 🔨 **Commit** | \`${context.sha.slice(0, 7)}\` |\n| 🌐 **Preview Link** | [${previewUrl}](${previewUrl}) |\n\n*Deployed via GitHub Actions*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(commentHeader));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
