name: Trasladar firma Android al entorno protegido

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/migrate-signing-once.yml"

permissions:
  contents: read

jobs:
  seal-signing:
    if: github.repository == 'CEOUBB/CEOUBB' && github.event.pull_request.number == 275 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/correcciones-auditoria-seguridad-octubre' && github.actor == 'pipe1os'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validar la firma y cifrar exclusivamente para Production
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DESTINATION_KEY: olpHFjJPAFYkpwVNTB1Wdc42KSqkpw5vfMMkugj7Dk8=
          DESTINATION_KEY_ID: "3380204578043523366"
        run: |
          set -euo pipefail
          set +x
          umask 077
          migration_dir=$(mktemp -d)
          trap 'rm -rf "$migration_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$migration_dir/signing.jks"
          cat > "$migration_dir/VerifyAndroidKey.java" <<'JAVA'
          import java.io.File;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.Signature;
          import java.util.Arrays;
          import java.util.HexFormat;

          class VerifyAndroidKey {
              public static void main(String[] args) throws Exception {
                  char[] storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray();
                  char[] keyPassword = System.getenv("ANDROID_KEY_PASSWORD").toCharArray();

                  try {
                      var store = KeyStore.getInstance(new File(args[0]), storePassword);
                      var alias = System.getenv("ANDROID_KEY_ALIAS");
                      var key = store.getKey(alias, keyPassword);
                      var certificate = store.getCertificate(alias);

                      if (!(key instanceof PrivateKey privateKey) || certificate == null) {
                          throw new IllegalStateException("Missing release private key");
                      }
                      var fingerprint = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(certificate.getEncoded()));

                      if (!fingerprint.equals("9bcb7f5ef08097ab286a924ef225fad3210d108cbe482b81d5b5936410400495")) {
                          throw new IllegalStateException("Published APK certificate mismatch");
                      }
                      var signature = Signature.getInstance("SHA256withRSA");
                      var challenge = "CEOUBB protected signing migration".getBytes(StandardCharsets.UTF_8);
                      signature.initSign(privateKey);
                      signature.update(challenge);
                      var signed = signature.sign();
                      signature.initVerify(certificate);
                      signature.update(challenge);

                      if (!signature.verify(signed)) {
                          throw new IllegalStateException("Release private key validation failed");
                      }
                      System.out.println("Published certificate and release private key verified");
                  } finally {
                      Arrays.fill(storePassword, '\0');
                      Arrays.fill(keyPassword, '\0');
                  }
              }
          }
          JAVA
          java "$migration_dir/VerifyAndroidKey.java" "$migration_dir/signing.jks"
          mkdir sealed-signing
          php <<'PHP'
          <?php
          $recipient = base64_decode(getenv('DESTINATION_KEY'), true);

          if ($recipient === false || strlen($recipient) !== SODIUM_CRYPTO_BOX_PUBLICKEYBYTES) {
              throw new RuntimeException('Invalid Production public key');
          }
          $selfCheck = sodium_crypto_box_keypair();
          $sealedCheck = sodium_crypto_box_seal('migration check', sodium_crypto_box_publickey($selfCheck));

          if (sodium_crypto_box_seal_open($sealedCheck, $selfCheck) !== 'migration check') {
              throw new RuntimeException('Sealed box verification failed');
          }
          $secrets = [];

          foreach (['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'] as $name) {
              $value = getenv($name);

              if ($value === false || $value === '') {
                  throw new RuntimeException('Missing original signing credential');
              }
              $secrets[$name] = base64_encode(sodium_crypto_box_seal($value, $recipient));
              sodium_memzero($value);
          }
          file_put_contents('sealed-signing/production-secrets.json', json_encode(['key_id' => getenv('DESTINATION_KEY_ID'), 'secrets' => $secrets], JSON_THROW_ON_ERROR));
          echo "Signing credentials sealed for GitHub Production only\n";
          PHP

      - name: Conservar únicamente los valores cifrados para GitHub
        uses: actions/upload-artifact@v4
        with:
          name: production-sealed-signing
          path: sealed-signing/production-secrets.json
          retention-days: 1
          if-no-files-found: error
