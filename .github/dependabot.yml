version: 2
updates:
  # Mantener dependencias de npm/pnpm actualizadas con parches de seguridad (raíz)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Mantener GitHub Actions (.github/workflows) al día
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # Monitorización de dependencias de Firebase Functions (Node.js/npm)
  - package-ecosystem: "npm"
    directory: "/firebase/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      firebase-dependencies:
        patterns:
          - "*"

  # Monitorización de dependencias y plugins de Gradle en Android
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      android-dependencies:
        patterns:
          - "*"
