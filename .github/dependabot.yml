version: 2
updates:
  # Mantener dependencias de npm/pnpm actualizadas con parches de seguridad
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Mantener GitHub Actions (.github/workflows) al día
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-dependencies:
        patterns:
          - "*"
